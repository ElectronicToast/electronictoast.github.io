<!-- Used by theme-home-builtin-1,2,3 -->

<div class="home-network-links">
  {% for profile in site.data.bio.basics.profiles %}
    <a href="{{ profile.url }}" aria-label="{{ profile.network | capitalize | escape }}">
      <i class="big {{ profile.network | downcase }} icon icon-color" aria-hidden="true"></i>
    </a>
    {% if forloop.first and site.data.bio.basics.email-display %}
      <span class="home-email">{{ site.data.bio.basics.email-display | escape }}</span>
    {% endif %}
  {% endfor %}
</div>
