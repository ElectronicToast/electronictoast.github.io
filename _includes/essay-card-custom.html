<!-- Publication tiles used by theme-essays-custom. -->

<a class="card publication-card" href="{{ site.baseurl}}{{ include.page.url }}">
  <div class="content">
    {% if include.page.venue %}
      <span class="publication-venue">{{ include.page.venue | escape }}</span>
    {% endif %}
    <span class="header">{{ include.page.title }}</span>
    <div class="meta">
      <span class="date">{{ include.page.date | date_to_string }}</span>
    </div>

    {% if include.page.authors %}
      <div class="description publication-authors">
        <p>{{ include.page.authors | escape }}</p>
      </div>
    {% endif %}
  </div>

  <div class="extra content">
    <div class="ui mini labels">
      {% for label in include.page.labels %}
      <div class="ui basic label">{{ label }}</div>
      {% endfor %}
    </div>
  </div>

</a>
